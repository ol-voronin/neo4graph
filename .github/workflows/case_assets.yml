name: case-assets

# Property named in court decisions (arrest rulings) -> case_assets (src/case_assets.py, migration 025). Daily in the
# 12:35 Neon wake window, after the registry chain has brought new decision texts; manual runs for a backfill.

on:
  schedule:
    - cron: "50 12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "max decisions to read"
        default: "200"
      dry_run:
        description: "print, do not write"
        type: boolean
        default: false

concurrency:
  group: case-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.PR_ANTH_KEY || secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" python-dotenv anthropic
      - run: python src/case_assets.py --limit "${{ github.event.inputs.limit || '200' }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
