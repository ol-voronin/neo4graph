name: vps-secrets

# Copies the search / model keys the VPS queue drain needs (scripts/drain_loop.sh) from the repository secrets into
# /etc/neo4graph.env. The SSH key can only run /usr/local/sbin/neo4graph-setsecrets there (forced command), which accepts
# just these names and prints nothing back. Run it again after a key changes.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send keys to the VPS
        env:
          KEY: ${{ secrets.VPS_SECRETS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.PR_ANTH_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GNEOJ }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > k
          echo "185.233.44.248 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILUe71XYSgw/OXtKEgGMHY6WKdnGVg/IaxPFwtZkVCzd" > kh
          for n in ANTHROPIC_API_KEY ANTHROPIC_WORKSPACE_ID TAVILY_API_KEY BRAVE_API_KEY GOOGLE_CSE_KEY GOOGLE_CSE_ID GEMINI_API_KEY; do
            v="${!n}"; [ -n "$v" ] && printf '%s=%s\n' "$n" "$v"
          done | ssh -T -i k -o IdentitiesOnly=yes -o UserKnownHostsFile=kh -o StrictHostKeyChecking=yes root@185.233.44.248
          rm -f k kh
