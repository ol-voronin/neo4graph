name: label-batch

# Bulk labeling via Anthropic Message Batches (src/label_batch.py). submit: build + send; fetch: write finished batches.
# Batches finish within 24 h. Needs ANTHROPIC_API_KEY and DATABASE_URL.
# The schedule runs on the VPS since 2026-10-26 (neo4graph-label.timer, every 3 h: fetch, then submit the newest
# 1,500 unlabeled posts; deploy/vps.md). GitHub kept submitting once a day ~5 h late. This workflow is manual only
# (bulk submits, re-labels, drop); its batch ids live in the Actions cache, the VPS ones in /opt/neo4graph/data/batches.

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "submit | fetch | status | drop <batch ids>"
        default: "status"
      limit:
        description: "submit: max messages"
        default: "30000"
      scope:
        description: "submit: all (every channel, all of Ukraine) | panel (12 key channels since 2026-03-31)"
        default: "all"
      newest:
        description: "submit: newest unlabeled first"
        type: boolean
        default: true
      all_ua:
        description: "submit: label every Ukrainian post too, not only those with rule signals (threat/target/timeframe)"
        type: boolean
        default: false
      topics_since:
        description: "submit: instead of unlabeled posts, re-label topic posts labeled before the current prompt, published since YYYY-MM-DD"
        default: ""

concurrency:
  group: label-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" python-dotenv anthropic
      - name: Restore batch metadata
        uses: actions/cache@v4
        with:
          path: data/batches
          key: batches-${{ github.run_id }}
          restore-keys: batches-
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.PR_ANTH_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}   # needed when the key is not scoped to a workspace
          # keys of other workspaces whose batches are still pending (batches are visible only to their own workspace)
          ANTHROPIC_API_KEY_LEGACY: ${{ secrets.ANTHROPIC_API_KEY_LEGACY }},${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY missing"; exit 1; fi
          CMD="${{ github.event.inputs.cmd || 'fetch' }}"
          if [ "${{ github.event.schedule }}" = "40 3 * * *" ]; then python src/label_batch.py fetch && python src/label_batch.py submit --newest --limit 4000
          elif [ "$CMD" = "submit" ]; then python src/label_batch.py submit --limit "${{ github.event.inputs.limit || '30000' }}" ${{ github.event.inputs.scope == 'panel' && '--panel' || '' }} ${{ github.event.inputs.newest == 'true' && '--newest' || '' }} ${{ github.event.inputs.all_ua == 'true' && '--all-ua' || '' }} ${{ github.event.inputs.topics_since && format('--topics-since {0}', github.event.inputs.topics_since) || '' }}; else python src/label_batch.py $CMD; fi   # unquoted: "drop <ids>" splits into args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batches-${{ github.run_id }}
          path: data/batches
          if-no-files-found: ignore
