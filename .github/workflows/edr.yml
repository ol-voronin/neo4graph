name: edr-match

# Match organisations from entity extractions against the full ЄДР dump (330 MB zip from data.gov.ua), upsert
# matched legal entities into edr_orgs. Manual; no LLM quota used.

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Extra names to match, comma-separated (optional)"
        default: ""
      dry_run:
        description: "Print matches, do not write"
        type: boolean
        default: false

jobs:
  edr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" python-dotenv
      - name: Download dump and match
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python src/edr_match.py --download --from-db --names "${{ github.event.inputs.names }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
