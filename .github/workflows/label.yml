name: label

# LLM labeling of rhetoric features (docs/labeling_prompt.md). Needs secrets DATABASE_URL and ANTHROPIC_API_KEY.
# Manual run with dry_run=true prints labels for a random sample WITHOUT writing (use it for the QA pass).

on:
  # every 3 hours: newest unlabeled posts first. Gemini free tier has a small daily quota; the script stops cleanly on 429 and the next run continues.
  # To pause labeling, comment these two lines out.
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max messages to label"
        default: "150"
      provider:
        description: "anthropic (paid) or gemini (free tier, needs secret GEMINI_API_KEY)"
        default: "gemini"
      gold:
        description: "Label only posts from gold_sample (for comparison with manual labels)"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: random sample of 20, print only, no writes"
        type: boolean
        default: true

concurrency:
  group: label
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" python-dotenv anthropic
      - name: Label
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GNEOJ }}
          PROVIDER: ${{ github.event.inputs.provider || 'gemini' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL missing"; exit 1; fi
          if [ "$PROVIDER" = "gemini" ] && [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY missing"; exit 1; fi
          if [ "$PROVIDER" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY missing"; exit 1; fi
          if [ "${{ github.event.inputs.gold }}" = "true" ]; then
            python src/label_messages.py --provider "$PROVIDER" --gold --limit 200
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/label_messages.py --provider "$PROVIDER" --sample 20 --dry-run
          else
            python src/label_messages.py --provider "$PROVIDER" --limit "${{ github.event.inputs.limit || '100' }}"
          fi
