name: opendata

# Daily open data from data.gov.ua: Національна поліція (wanted persons in full, missing persons as counts; src/police_wanted.py,
# migration 021) and the Prosecutor General's report forms (src/ogp_reports.py, migration 022). Inside the 06:35 Neon wake
# window used by the statements pipeline.

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "police | ogp | arma | all"
        default: "all"

concurrency:
  group: opendata
  cancel-in-progress: false

jobs:
  opendata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" python-dotenv ijson
      - name: Police (wanted, missing)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.what == 'police' || github.event.inputs.what == 'all' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/police_wanted.py wanted missing
      - name: Prosecutor General report forms (weekly on Mondays; forms update ~8th of each month)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.what == 'ogp' || github.event.inputs.what == 'all' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then echo "not Monday: skipped"; exit 0; fi
          python src/ogp_reports.py
      - name: ARMA arrested assets register (weekly on Mondays; ~740 MB JSON, ~118 k assets kept)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.what == 'arma' || github.event.inputs.what == 'all' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then echo "not Monday: skipped"; exit 0; fi
          python src/arma_assets.py
