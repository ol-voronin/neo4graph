name: collect

# Collects public Telegram channels (keyless, via t.me/s) and loads them into Neon.
# Requires repository secret DATABASE_URL (Neon connection string). Without it the job only uploads an artifact.

on:
  # collection runs on the VPS every ~20 min (systemd neo4graph-collect, deploy/vps.md); this stays for manual backfills
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per channel (20 posts each). Use 40+ for a backfill run."
        default: "3"
      load_alerts:
        description: "Also (re)load air-raid alerts dataset into Neon (one-off / daily refresh)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "psycopg[binary]" python-dotenv
      - name: Collect and load (scripts/collect_once.sh, shared with live.yml)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAGES: ${{ github.event.inputs.pages || '3' }}
        run: bash scripts/collect_once.sh
      - name: Load air-raid alerts (manual runs with load_alerts=true)
        if: ${{ github.event.inputs.load_alerts == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git clone --depth 1 https://github.com/Vadimkin/ukrainian-air-raid-sirens-dataset.git /tmp/sirens
          python src/load_to_db.py alerts --dataset /tmp/sirens/datasets --official
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-data
          path: data/
          retention-days: 7
