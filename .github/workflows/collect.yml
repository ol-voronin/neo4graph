name: collect

# Collects public Telegram channels (keyless, via t.me/s) and loads them into Neon.
# Requires repository secret DATABASE_URL (Neon connection string). Without it the job only uploads an artifact.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages per channel (20 posts each). Use 40+ for a backfill run."
        default: "3"
      load_alerts:
        description: "Also (re)load air-raid alerts dataset into Neon (one-off / daily refresh)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "psycopg[binary]" python-dotenv
      - name: Collect channels
        run: python src/collect_telegram.py --all --pages "${{ github.event.inputs.pages || '3' }}" --delay 1.0
      - name: Collect RSS sources (US official)
        run: python src/collect_rss.py --all
      - name: Collect Air Force summaries (waves)
        run: |
          python src/collect_telegram.py --channels kpszsu --query "ЗБИТО/ПОДАВЛЕНО" --tag _summaries --pages 3 --delay 1.0
          python src/parse_kpszsu.py
          python src/parse_kharkiv_daily.py
      - name: Collect oblast administration summaries (oblast_daily ground truth)
        # into data/ova (runner disk only): parsed into oblast_daily, never loaded into messages (keeps Neon small)
        run: |
          python src/collect_telegram.py --channels $(python src/oblasts.py --handles) --out-dir data/ova --pages 3 --delay 1.0
          python src/parse_oblast_daily.py
      - name: Load into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python src/load_to_db.py messages
            python src/load_to_db.py waves
            python src/load_to_db.py kharkiv
            python src/load_to_db.py oblast   # skips with a message until migration 015 is applied
          else
            echo "DATABASE_URL secret is not set: skipping DB load"
          fi
      - name: Load air-raid alerts (manual runs with load_alerts=true)
        if: ${{ github.event.inputs.load_alerts == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git clone --depth 1 https://github.com/Vadimkin/ukrainian-air-raid-sirens-dataset.git /tmp/sirens
          python src/load_to_db.py alerts --dataset /tmp/sirens/datasets --official
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-data
          path: data/
          retention-days: 7
